# Pemeriksaan kerentanan mingguan (dan manual). Gagal = GitHub mengirim email ke pemilik repo.
# Dua hal: (1) image dasar di Dockerfile (Node + Alpine), (2) dependensi npm produksi.
# Tidak menyentuh VPS. Image aplikasi penuh tidak dibangun di runner (lihat docs/ci-cd.md).
name: security

on:
  schedule: [{ cron: "0 2 * * 1" }] # Senin 09:00 WIB
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Image dasar dari Dockerfile
        id: base
        run: echo "image=$(grep -m1 '^FROM ' Dockerfile | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Trivy, image dasar (HIGH/CRITICAL yang sudah ada perbaikannya)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.base.outputs.image }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Audit dependensi produksi
        run: pnpm audit --prod
